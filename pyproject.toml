[project]
name = "todo-tui"
version = "0.1.0"
description = "A simple TODO TUI app implemented in Python using Textual"
authors = [{name = "cosmicBboy"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
todo-tui = "todo_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_tui"]